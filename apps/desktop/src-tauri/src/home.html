<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenVids — Projects</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0a0a0a;
        color: #e5e5e5;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      header.top {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.25rem 2rem;
        border-bottom: 1px solid #2a2a2a;
        position: sticky;
        top: 0;
        background: #0a0a0a;
        z-index: 5;
      }
      .brand {
        font-size: 1.1rem;
        font-weight: 600;
        color: #f5f5f5;
        letter-spacing: -0.01em;
      }
      .brand small {
        display: block;
        font-size: 0.75rem;
        font-weight: 400;
        color: #666;
      }
      .spacer {
        flex: 1;
      }
      .header-actions {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      [hidden] {
        display: none !important;
      }
      button,
      .btn {
        font: inherit;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid #3a3a3a;
        background: #1a1a1a;
        color: #e5e5e5;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        font-weight: 500;
      }
      button:hover {
        border-color: #4a4a4a;
        background: #222;
      }
      button:focus-visible,
      [tabindex]:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
      }
      button.primary {
        background: #f5f5f5;
        border-color: #f5f5f5;
        color: #0a0a0a;
      }
      button.primary:hover {
        opacity: 0.85;
      }
      button.danger {
        border-color: rgba(239, 68, 68, 0.4);
        color: #f87171;
      }
      button.danger:hover {
        background: rgba(239, 68, 68, 0.12);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      main {
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
      }
      h2.section {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #a0a0a0;
        margin: 0 0 1rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 1.25rem;
      }
      .card {
        background: #141414;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        overflow: hidden;
        transition: border-color 0.15s ease;
        position: relative;
      }
      .card:hover {
        border-color: #3a3a3a;
      }
      .card .open-hit {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        text-align: left;
        color: inherit;
      }
      .thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #1a1a1a;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-bottom: 1px solid #2a2a2a;
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .thumb .ph {
        color: #666;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
      }
      .meta {
        padding: 0.8rem 0.9rem 0.9rem;
      }
      .meta .name {
        font-weight: 600;
        color: #f5f5f5;
        font-size: 0.92rem;
        margin: 0 0 0.25rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta .path {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.7rem;
        color: #666;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta .when {
        font-size: 0.75rem;
        color: #a0a0a0;
        margin-top: 0.35rem;
      }
      .badge {
        display: inline-block;
        font-size: 0.68rem;
        font-weight: 600;
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
        margin-top: 0.4rem;
      }
      .badge.missing {
        color: #f87171;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
      .kebab {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        width: 2rem;
        height: 2rem;
        padding: 0;
        line-height: 1;
        background: rgba(10, 10, 10, 0.75);
        border-color: #3a3a3a;
      }
      .menu {
        position: absolute;
        top: 2.75rem;
        right: 0.5rem;
        background: #1a1a1a;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        min-width: 11rem;
        padding: 0.3rem;
        z-index: 10;
      }
      .menu[hidden] {
        display: none;
      }
      .menu button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        padding: 0.5rem 0.7rem;
        font-size: 0.83rem;
      }
      .menu button:hover {
        background: #2a2a2a;
      }
      .menu button.danger-item {
        color: #f87171;
      }
      .empty {
        text-align: center;
        padding: 4rem 1rem;
        border: 1px dashed #2a2a2a;
        border-radius: 12px;
        color: #a0a0a0;
      }
      .empty h3 {
        color: #f5f5f5;
        margin: 0 0 0.5rem;
        font-weight: 600;
      }
      .empty p {
        margin: 0 0 1.5rem;
        font-size: 0.9rem;
      }
      .empty .row {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
      }
      /* Modal */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: grid;
        place-items: center;
        z-index: 50;
      }
      .overlay[hidden] {
        display: none;
      }
      .dialog {
        background: #141414;
        border: 1px solid #3a3a3a;
        border-radius: 12px;
        width: min(30rem, calc(100vw - 3rem));
        max-height: calc(100vh - 4rem);
        overflow: auto;
        padding: 1.5rem;
      }
      .dialog h3 {
        margin: 0 0 1rem;
        color: #f5f5f5;
        font-size: 1rem;
      }
      .field {
        margin-bottom: 0.9rem;
      }
      .field label {
        display: block;
        font-size: 0.78rem;
        color: #a0a0a0;
        margin-bottom: 0.35rem;
      }
      .field input,
      .field select {
        width: 100%;
        font: inherit;
        font-size: 0.88rem;
        background: #0a0a0a;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        color: #e5e5e5;
        padding: 0.5rem 0.6rem;
      }
      .field .hint {
        font-size: 0.72rem;
        color: #666;
        margin-top: 0.3rem;
      }
      .field-row {
        display: flex;
        gap: 0.75rem;
      }
      .field-row .field {
        flex: 1;
      }
      .dialog .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: flex-end;
        margin-top: 1.25rem;
      }
      .form-error {
        color: #f87171;
        font-size: 0.82rem;
        min-height: 1.2em;
        margin: 0.25rem 0 0;
      }
      /* Loading overlay */
      #loading .dialog {
        text-align: center;
      }
      .spinner {
        width: 2rem;
        height: 2rem;
        margin: 0.5rem auto 1rem;
        border: 3px solid #2a2a2a;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Toasts */
      #toasts {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        z-index: 100;
        width: min(32rem, calc(100vw - 3rem));
      }
      .toast {
        background: #1a1a1a;
        border: 1px solid #3a3a3a;
        border-left: 3px solid #3b82f6;
        border-radius: 8px;
        padding: 0.7rem 1rem;
        font-size: 0.85rem;
      }
      .toast.error {
        border-left-color: #ef4444;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">OpenVids<small>HyperFrames Studio on the desktop</small></div>
      <div class="spacer"></div>
      <div id="header-actions" class="header-actions" hidden>
        <button id="btn-open" type="button">Open existing project</button>
        <button id="btn-create" class="primary" type="button">Create new project</button>
      </div>
    </header>
    <main>
      <h2 class="section">Recent projects</h2>
      <div id="grid" class="grid" role="list"></div>
      <div id="empty" class="empty" hidden>
        <h3>No projects yet</h3>
        <p>Create a new HyperFrames project or open an existing project folder.</p>
        <div class="row">
          <button id="btn-open-2" type="button">Open existing project</button>
          <button id="btn-create-2" class="primary" type="button">Create new project</button>
        </div>
      </div>
    </main>

    <div id="create-overlay" class="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="create-title">
        <h3 id="create-title">Create new project</h3>
        <p
          id="create-parent"
          class="path"
          style="
            font-size: 0.75rem;
            color: #666;
            margin: 0 0 1rem;
            font-family: ui-monospace, Menlo, monospace;
          "
        ></p>
        <div class="field">
          <label for="f-name">Project name (folder name)</label>
          <input id="f-name" type="text" value="my-video" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-fps">Frame rate (fps)</label>
            <select id="f-fps">
              <option value="24">24</option>
              <option value="25">25</option>
              <option value="30" selected>30</option>
              <option value="60">60</option>
            </select>
          </div>
          <div class="field">
            <label for="f-duration">Duration (seconds)</label>
            <input id="f-duration" type="number" min="1" max="3600" step="1" value="10" />
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-aspect">Aspect ratio</label>
            <select id="f-aspect">
              <option value="16:9" selected>16:9 landscape</option>
              <option value="9:16">9:16 portrait</option>
              <option value="1:1">1:1 square</option>
              <option value="4:5">4:5 portrait</option>
              <option value="custom">Custom…</option>
            </select>
          </div>
          <div class="field">
            <label for="f-preset">Resolution</label>
            <select id="f-preset"></select>
          </div>
        </div>
        <div class="field-row" id="custom-size" hidden>
          <div class="field">
            <label for="f-width">Width (px)</label>
            <input id="f-width" type="number" min="1" max="8192" value="1920" />
          </div>
          <div class="field">
            <label for="f-height">Height (px)</label>
            <input id="f-height" type="number" min="1" max="8192" value="1080" />
          </div>
        </div>
        <p id="create-error" class="form-error" role="alert"></p>
        <div class="actions">
          <button id="create-cancel" type="button">Cancel</button>
          <button id="create-submit" class="primary" type="button">Create &amp; open</button>
        </div>
      </div>
    </div>

    <div id="rename-overlay" class="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rename-title">
        <h3 id="rename-title">Rename project</h3>
        <div class="field">
          <label for="r-name">New folder name</label>
          <input id="r-name" type="text" autocomplete="off" spellcheck="false" />
          <div class="hint">Renames the folder on disk. The project id is the folder name.</div>
        </div>
        <p id="rename-error" class="form-error" role="alert"></p>
        <div class="actions">
          <button id="rename-cancel" type="button">Cancel</button>
          <button id="rename-submit" class="primary" type="button">Rename</button>
        </div>
      </div>
    </div>

    <div id="trash-overlay" class="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="trash-title">
        <h3 id="trash-title">Move project to Trash?</h3>
        <p id="trash-text" style="font-size: 0.88rem; color: #a0a0a0; line-height: 1.6"></p>
        <div class="actions">
          <button id="trash-cancel" type="button">Cancel</button>
          <button id="trash-submit" class="danger" type="button">Move to Trash</button>
        </div>
      </div>
    </div>

    <div id="loading" class="overlay" hidden>
      <div class="dialog" role="status">
        <div class="spinner"></div>
        <p id="loading-text" style="color: #a0a0a0; font-size: 0.9rem">Opening project…</p>
      </div>
    </div>

    <div id="toasts" aria-live="polite"></div>

    <script>
      const TOKEN = "__OPENVids_TOKEN__";
      const $ = (id) => document.getElementById(id);

      async function api(path, body) {
        const res = await fetch(path, {
          method: body === undefined ? "GET" : "POST",
          headers: {
            "X-OpenVids-Token": TOKEN,
            ...(body === undefined ? {} : { "Content-Type": "application/json" }),
          },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);
        if (data.error) throw new Error(data.error);
        return data;
      }

      function toast(message, kind) {
        const el = document.createElement("div");
        el.className = "toast" + (kind === "error" ? " error" : "");
        el.textContent = message;
        $("toasts").appendChild(el);
        setTimeout(() => el.remove(), 6000);
      }

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function timeAgo(ts) {
        const s = Math.max(0, Date.now() / 1000 - ts);
        if (s < 60) return "just now";
        if (s < 3600) return `${Math.floor(s / 60)} min ago`;
        if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
        const d = Math.floor(s / 86400);
        return d === 1 ? "yesterday" : `${d} days ago`;
      }

      function closeMenus() {
        document.querySelectorAll(".menu").forEach((m) => {
          m.hidden = true;
        });
      }

      async function load() {
        let recents = [];
        try {
          recents = (await api("/api/recents")).recents || [];
        } catch (e) {
          toast(`Could not load recent projects: ${e.message}`, "error");
        }
        const grid = $("grid");
        grid.textContent = "";
        const hasRecents = recents.length !== 0;
        $("empty").hidden = hasRecents;
        $("header-actions").hidden = !hasRecents;
        for (const r of recents) {
          const card = document.createElement("article");
          card.className = "card";
          card.setAttribute("role", "listitem");
          const ratio = r.width && r.height ? `${r.width} / ${r.height}` : "16 / 9";
          const preview = r.thumb
            ? `<img src="/thumb/${esc(r.thumb)}" alt="" loading="lazy" />`
            : `<span class="ph">${r.width && r.height ? `${r.width}×${r.height}` : "No preview yet"}</span>`;
          const missing = r.missing
            ? `<span class="badge missing">Folder missing</span>`
            : `<div class="when">Last opened ${esc(timeAgo(r.last_opened))}</div>`;
          card.innerHTML =
            `<button type="button" class="open-hit" aria-label="Open ${esc(r.id)}">` +
            `<span class="thumb" style="aspect-ratio:${esc(ratio)}">${preview}</span>` +
            `<span class="meta" style="display:block"><span class="name" style="display:block">${esc(r.id)}</span>` +
            `<span class="path" style="display:block">${esc(r.dir)}</span>${missing}</span></button>` +
            `<button type="button" class="kebab" aria-label="Actions for ${esc(r.id)}" aria-haspopup="menu">…</button>` +
            `<div class="menu" role="menu" hidden>` +
            `<button type="button" data-act="rename">Rename…</button>` +
            `<button type="button" data-act="remove">Remove from recents</button>` +
            `<button type="button" data-act="trash" class="danger-item">Move folder to Trash…</button></div>`;
          const hit = card.querySelector(".open-hit");
          hit.disabled = !!r.missing;
          if (!r.missing) {
            hit.addEventListener("click", () => openById(r.id));
          } else {
            hit.style.cursor = "default";
          }
          const kebab = card.querySelector(".kebab");
          const menu = card.querySelector(".menu");
          kebab.addEventListener("click", (e) => {
            e.stopPropagation();
            const was = menu.hidden;
            closeMenus();
            menu.hidden = !was;
          });
          menu.addEventListener("click", (e) => {
            const act = e.target.closest("button")?.dataset.act;
            if (!act) return;
            closeMenus();
            if (act === "rename") showRename(r.id);
            else if (act === "remove") removeRecent(r.id);
            else if (act === "trash") showTrash(r.id, r.dir);
          });
          grid.appendChild(card);
        }
      }

      let pollTimer = null;
      function showLoading(text) {
        $("loading-text").textContent = text || "Opening project…";
        $("loading").hidden = false;
        stopPoll();
        pollTimer = setInterval(async () => {
          try {
            const s = await api("/api/open-state");
            if (s.phase === "failed") {
              stopPoll();
              $("loading").hidden = true;
              toast(`Could not open the project: ${s.error || "unknown error"}`, "error");
              load();
            }
          } catch {
            /* the window navigated away or the server restarted; stop */ stopPoll();
          }
        }, 600);
      }
      function stopPoll() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      async function openById(id) {
        showLoading(`Opening ${id}…`);
        try {
          await api("/api/open", { id });
        } catch (e) {
          stopPoll();
          $("loading").hidden = true;
          toast(e.message, "error");
          load();
        }
      }

      async function pickOpen() {
        showLoading("Waiting for the folder picker…");
        try {
          const r = await api("/api/pick-open", {});
          if (r.cancelled) {
            stopPoll();
            $("loading").hidden = true;
            return;
          }
          // Success navigates away; failure is reported via open-state polling.
        } catch (e) {
          stopPoll();
          $("loading").hidden = true;
          toast(e.message, "error");
        }
      }

      // ——— Create flow ———
      const PRESETS = {
        "16:9": [
          ["720p · 1280×720", 1280, 720],
          ["1080p · 1920×1080", 1920, 1080],
          ["4K · 3840×2160", 3840, 2160],
        ],
        "9:16": [
          ["720p · 720×1280", 720, 1280],
          ["1080p · 1080×1920", 1080, 1920],
          ["4K · 2160×3840", 2160, 3840],
        ],
        "1:1": [
          ["720p · 720×720", 720, 720],
          ["1080p · 1080×1080", 1080, 1080],
          ["4K · 2160×2160", 2160, 2160],
        ],
        "4:5": [
          ["864×1080", 864, 1080],
          ["1080×1350", 1080, 1350],
          ["4K · 2160×2700", 2160, 2700],
        ],
      };
      let createParent = null;

      function refreshPresets() {
        const aspect = $("f-aspect").value;
        const sel = $("f-preset");
        sel.textContent = "";
        if (aspect === "custom") {
          $("custom-size").hidden = false;
          sel.appendChild(new Option("Custom size below", "custom"));
          return;
        }
        $("custom-size").hidden = true;
        for (const [label, w, h] of PRESETS[aspect]) {
          sel.appendChild(new Option(label, `${w}x${h}`));
        }
        sel.selectedIndex = 1;
      }

      async function startCreate() {
        $("create-error").textContent = "";
        let parent = null;
        try {
          parent = await api("/api/pick-parent", {});
        } catch (e) {
          toast(e.message, "error");
          return;
        }
        if (parent.cancelled) return;
        createParent = parent.parent;
        $("create-parent").textContent = `Location: ${createParent}`;
        $("create-overlay").hidden = false;
        refreshPresets();
        $("f-name").focus();
        $("f-name").select();
      }

      async function submitCreate() {
        $("create-error").textContent = "";
        const aspect = $("f-aspect").value;
        let width, height;
        if (aspect === "custom" || $("f-preset").value === "custom") {
          width = Number($("f-width").value);
          height = Number($("f-height").value);
        } else {
          [width, height] = $("f-preset").value.split("x").map(Number);
        }
        const body = {
          parent: createParent,
          name: $("f-name").value.trim(),
          fps: $("f-fps").value,
          width,
          height,
          duration: Number($("f-duration").value),
        };
        $("create-submit").disabled = true;
        try {
          await api("/api/create", body);
          $("create-overlay").hidden = true;
          showLoading(`Creating ${body.name}…`);
        } catch (e) {
          $("create-error").textContent = e.message;
        } finally {
          $("create-submit").disabled = false;
        }
      }

      // ——— Rename / remove / trash ———
      let renameId = null;
      function showRename(id) {
        renameId = id;
        $("r-name").value = id;
        $("rename-error").textContent = "";
        $("rename-overlay").hidden = false;
        $("r-name").focus();
        $("r-name").select();
      }
      async function submitRename() {
        $("rename-error").textContent = "";
        try {
          await api("/api/rename", { id: renameId, new_name: $("r-name").value.trim() });
          $("rename-overlay").hidden = true;
          load();
        } catch (e) {
          $("rename-error").textContent = e.message;
        }
      }
      async function removeRecent(id) {
        try {
          await api("/api/remove", { id });
          load();
        } catch (e) {
          toast(e.message, "error");
        }
      }
      let trashId = null;
      function showTrash(id, dir) {
        trashId = id;
        $("trash-text").textContent =
          `“${id}” (${dir}) will be moved to the OS Trash. You can restore it from there.`;
        $("trash-overlay").hidden = false;
        $("trash-submit").focus();
      }
      async function submitTrash() {
        try {
          await api("/api/trash", { id: trashId });
          $("trash-overlay").hidden = true;
          toast(`Moved ${trashId} to the Trash.`);
          load();
        } catch (e) {
          toast(e.message, "error");
        }
      }

      // ——— Wiring ———
      $("btn-open").addEventListener("click", pickOpen);
      $("btn-open-2").addEventListener("click", pickOpen);
      $("btn-create").addEventListener("click", startCreate);
      $("btn-create-2").addEventListener("click", startCreate);
      $("f-aspect").addEventListener("change", refreshPresets);
      $("create-cancel").addEventListener("click", () => {
        $("create-overlay").hidden = true;
      });
      $("create-submit").addEventListener("click", submitCreate);
      $("rename-cancel").addEventListener("click", () => {
        $("rename-overlay").hidden = true;
      });
      $("rename-submit").addEventListener("click", submitRename);
      $("trash-cancel").addEventListener("click", () => {
        $("trash-overlay").hidden = true;
      });
      $("trash-submit").addEventListener("click", submitTrash);
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".menu") && !e.target.closest(".kebab")) closeMenus();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeMenus();
          $("create-overlay").hidden = true;
          $("rename-overlay").hidden = true;
          $("trash-overlay").hidden = true;
        }
        if (e.key === "Enter" && e.target.id === "r-name") submitRename();
        if (e.key === "Enter" && e.target.id === "f-name") submitCreate();
      });

      load();
      // If the app is already opening a project (launch with OPENVIDS_PROJECT),
      // show the loading state until the window navigates away or it fails.
      api("/api/open-state")
        .then((s) => {
          if (s.phase === "opening") showLoading("Opening project…");
          else if (s.phase === "failed")
            toast(`Could not open the project: ${s.error || "unknown error"}`, "error");
        })
        .catch(() => {});
    </script>
  </body>
</html>
