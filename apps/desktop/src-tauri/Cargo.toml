[package]
name = "openvids-desktop"
version = "0.1.0"
description = "OpenVids — HyperFrames Studio on the desktop"
authors = ["OpenVids"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openvids_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
rfd = "0.15"

[target.'cfg(unix)'.dependencies]
# killpg, for reaping the sidecar's whole process group. See sidecar::terminate.
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
