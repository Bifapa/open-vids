[package]
name = "openvids-desktop"
version = "0.2.0"
description = "OpenVids — agent-native desktop video editor"
homepage = "https://openvids.ai"
authors = ["OpenVids"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openvids_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
getrandom = "0.3"
sys-locale = "0.3"
trash = "5"
# WHATWG URL parsing for the Asset Search policy (research_policy.rs): the same
# host normalization as `new URL` in the Studio server. Already in the tree via tauri.
url = "2"
tauri-plugin-updater = "2"
semver = "1"
# The usage statistics POST (telemetry.rs): a small blocking client on its own
# thread, rustls with ring (already in the tree via the updater) and Mozilla's roots.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
# killpg, for reaping the sidecar's whole process group. See sidecar::terminate.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Reading the drag pasteboard for real file paths of a drop on the Projects
# page (drop_paths.rs). Same versions wry already links.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
