name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.2"
  # Minimum supported Node (CONTRIBUTING.md). Vitest runs on Node.
  NODE_VERSION: "22"

jobs:
  checks:
    name: Checks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check locales
        run: bun run locales:check

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck && bun run typecheck:scripts

      - name: Script tests
        run: bun run test:scripts

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check desktop
        run: bun run desktop:check

      - name: Desktop Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Desktop tests
        run: bun run --cwd apps/desktop test

  test:
    name: Test (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: studio
            packages: studio
          - name: render
            packages: core engine producer cli
          - name: services
            packages: agent-protocol agent-runtime studio-server parsers lint sdk shader-transitions player
            skills: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The engine's HDR PNG tests read one LFS fixture; the rest of LFS is the producer's regression corpus.
      - name: Fetch test fixtures from LFS
        run: git lfs pull --include="packages/producer/tests/hdr-regression/src/hdr-photo-pq.png"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Tests synthesize fixtures with libvorbis, libaom-av1, libvpx and x264; Homebrew's `ffmpeg` lacks some of them.
      - name: Install FFmpeg
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Several packages test against the built dist of agent-protocol and studio-server.
      - name: Build
        run: bun run build

      - name: Test
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          failed=""
          for p in $PACKAGES; do
            echo "::group::$p"
            bun run --cwd "packages/$p" test || failed="$failed $p"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Tests failed in:$failed"
            exit 1
          fi

      - name: Skills tests
        if: ${{ matrix.skills }}
        run: bun run test:skills
