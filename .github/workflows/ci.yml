name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check locales
        run: bun run locales:check

      - name: Build
        run: bun run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check desktop
        run: bun run desktop:check
