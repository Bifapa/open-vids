name: Release

# Build and sign the macOS and Windows releases for a version tag and create a DRAFT GitHub Release.
#
# The in-app updater points at https://github.com/bazodev/open-vids/releases/latest/download/latest.json.
# That URL only resolves once the release is *published*: GitHub's "latest" is the most recent release
# that is neither a draft nor a prerelease. The workflow therefore leaves the release as a draft —
# check the assets, then publish it to make the update visible to installed apps.
#
# A tag with a pre-release version (`v0.5.0-beta.1`) is a BETA: its release is a GitHub pre-release and
# carries `beta.json` instead of `latest.json`, so the stable update URL never sees it. Publishing the
# beta release triggers beta-manifest.yml, which copies `beta.json` to the `channel-beta` release —
# the fixed address installs that turned on "Get beta versions" read next to the stable manifest.

on:
  push:
    tags: ["v*"]

# Read-only by default; only the publish job, which creates the draft release, may write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build macOS ${{ github.ref_name }}
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The only Git LFS objects in the repository are producer test fixtures; the release
          # build never reads them, so skip the (metered) LFS downloads entirely.
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      # actions/checkout fetches only the commit, but an annotated tag's message becomes the
      # release notes, so fetch the tag object itself.
      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same Bun as CI: the staged app runs on this Bun binary (apps/desktop/scripts/stage-runtime.mjs).
          bun-version: "1.4.2"
          # The binary is copied into the signed app. A cache entry written by a main-branch CI run
          # (which executes dependency and test code) must never supply it.
          no-cache: true

      - name: Verify the Bun binary
        env:
          # SHA-256 of bun-darwin-aarch64/bun inside the official bun-v1.4.2 release zip (the zip itself is
          # 90987a3a16d7db556d886ac3d551e7b6d3edf0a1cf43acaed622e8676be1d12f in that release's SHASUMS256.txt).
          # Bump together with bun-version.
          BUN_SHA256: 35d20dd0263e5c950194434b925454fdfa9ba6e4467da960410fa05b08a7a5b5
        run: |
          set -euo pipefail
          actual="$(shasum -a 256 "$(command -v bun)" | cut -d' ' -f1)"
          if [ "$actual" != "$BUN_SHA256" ]; then
            echo "bun binary digest mismatch: expected ${BUN_SHA256}, got ${actual}" >&2
            exit 1
          fi

      - name: Setup Rust
        # Pinned to a commit of the `stable` branch; the toolchain channel is chosen by the input instead of the ref.
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-01
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the tag matches the app version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declared="$(bun scripts/desktop-version.ts --print)"
          if [ "$version" != "$declared" ]; then
            echo "tag ${GITHUB_REF_NAME} says ${version}, but the app version is ${declared}" >&2
            exit 1
          fi
          bun scripts/desktop-version.ts --check

      # The updater signing key signs every update installed apps accept, so only the `tauri build`
      # step receives it. The steps before it run workspace build scripts and the runtime staging
      # installs (dependency lifecycle scripts), which must never see the key in their environment.
      - name: Build workspace packages
        run: bun run --cwd apps/desktop build:hyperframes

      - name: Stage the runtime
        run: bun run --cwd apps/desktop stage

      - name: Build and sign the app
        run: bun apps/desktop/scripts/tauri-build.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENVIDS_RELEASE: "1"

      - name: Collect macOS artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle="apps/desktop/src-tauri/target/release/bundle"
          dmg="${bundle}/dmg/OpenVids_${version}_aarch64.dmg"
          app_tar="${bundle}/macos/OpenVids.app.tar.gz"
          app_sig="${bundle}/macos/OpenVids.app.tar.gz.sig"

          for file in "$dmg" "$app_tar" "$app_sig"; do
            if [ ! -f "$file" ]; then
              echo "missing bundle artifact: $file" >&2
              exit 1
            fi
          done

          mkdir -p release-assets
          cp "$dmg" "release-assets/OpenVids_${version}_aarch64.dmg"
          cp "$app_tar" "release-assets/OpenVids_${version}_aarch64.app.tar.gz"
          cp "$app_sig" "release-assets/OpenVids_${version}_aarch64.app.tar.gz.sig"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: release-assets/
          if-no-files-found: error

  build-windows:
    name: Build Windows ${{ github.ref_name }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Enforce LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Same as macOS: the release build never reads LFS fixtures.
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
          no-cache: true

      - name: Verify the Bun binary
        env:
          # SHA-256 of bun-windows-x64/bun.exe inside the official bun-v1.4.2 release zip (the zip itself is
          # ce4c17497b2f29712a99d3d53f028de28cd42e3bacb8589599e7f000e49b6405 in that release's SHASUMS256.txt).
          # Bump together with bun-version.
          BUN_SHA256: 15277c59ccd6c6c20f8dc9716c2b59c1776320d606b6a8658f70be8799519ca4
        run: |
          set -euo pipefail
          actual="$(sha256sum "$(command -v bun.exe)" | cut -d' ' -f1)"
          if [ "$actual" != "$BUN_SHA256" ]; then
            echo "bun binary digest mismatch: expected ${BUN_SHA256}, got ${actual}" >&2
            exit 1
          fi

      - name: Setup Rust
        # Pinned to a commit of the `stable` branch; the toolchain channel is chosen by the input instead of the ref.
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch, 2026-10-01
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the tag matches the app version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declared="$(bun scripts/desktop-version.ts --print)"
          if [ "$version" != "$declared" ]; then
            echo "tag ${GITHUB_REF_NAME} says ${version}, but the app version is ${declared}" >&2
            exit 1
          fi
          bun scripts/desktop-version.ts --check

      # The updater signing key signs every update installed apps accept, so only the `tauri build`
      # step receives it. The steps before it run workspace build scripts and the runtime staging
      # installs (dependency lifecycle scripts), which must never see the key in their environment.
      - name: Build workspace packages
        run: bun run --cwd apps/desktop build:hyperframes

      - name: Stage the runtime
        run: bun run --cwd apps/desktop stage

      - name: Build and sign the app
        run: bun apps/desktop/scripts/tauri-build.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENVIDS_RELEASE: "1"

      - name: Collect Windows artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle="apps/desktop/src-tauri/target/release/bundle"
          setup="${bundle}/nsis/OpenVids_${version}_x64-setup.exe"
          setup_sig="${bundle}/nsis/OpenVids_${version}_x64-setup.exe.sig"

          for file in "$setup" "$setup_sig"; do
            if [ ! -f "$file" ]; then
              echo "missing bundle artifact: $file" >&2
              exit 1
            fi
          done

          mkdir -p release-assets
          cp "$setup" "release-assets/OpenVids_${version}_x64-setup.exe"
          cp "$setup_sig" "release-assets/OpenVids_${version}_x64-setup.exe.sig"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish draft release ${{ github.ref_name }}
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
        env:
          GIT_LFS_SKIP_SMUDGE: "1"

      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Download macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-macos
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-windows
          path: release-assets

      # The channel follows from the version: a pre-release version (`0.5.0-beta.1`) is a beta, anything
      # else is stable. A beta's manifest is `beta.json` and its release is a GitHub pre-release, so
      # `releases/latest/download/latest.json` (what stable installs read) never sees it; installs that
      # opted into betas read the `channel-beta` release, which beta-manifest.yml refreshes from this
      # release's `beta.json` when the beta is published.
      - name: Determine the channel
        id: channel
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Build metadata (`+…`) does not make a pre-release.
          if [[ "${version%%+*}" == *-* ]]; then
            {
              echo "channel=beta"
              echo "manifest=beta.json"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=stable"
              echo "manifest=latest.json"
              echo "prerelease=false"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Write the update manifest with both platforms
        env:
          MANIFEST: ${{ steps.channel.outputs.manifest }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app_tar="release-assets/OpenVids_${version}_aarch64.app.tar.gz"
          app_sig="release-assets/OpenVids_${version}_aarch64.app.tar.gz.sig"
          setup="release-assets/OpenVids_${version}_x64-setup.exe"
          setup_sig="release-assets/OpenVids_${version}_x64-setup.exe.sig"

          for file in "$app_tar" "$app_sig" "$setup" "$setup_sig"; do
            if [ ! -f "$file" ]; then
              echo "missing bundle artifact: $file" >&2
              exit 1
            fi
          done

          notes=""
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}" 2>/dev/null || true)" = "tag" ]; then
            notes="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          fi
          if [ -z "$notes" ]; then
            notes="See https://github.com/bazodev/open-vids/releases/tag/${GITHUB_REF_NAME}"
          fi
          printf '%s\n' "$notes" > "${RUNNER_TEMP}/release-notes.txt"

          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_signature "$(cat "$app_sig")" \
            --arg mac_url "https://github.com/bazodev/open-vids/releases/download/${GITHUB_REF_NAME}/OpenVids_${version}_aarch64.app.tar.gz" \
            --arg win_signature "$(cat "$setup_sig")" \
            --arg win_url "https://github.com/bazodev/open-vids/releases/download/${GITHUB_REF_NAME}/OpenVids_${version}_x64-setup.exe" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"darwin-aarch64": {signature: $mac_signature, url: $mac_url}, "windows-x86_64": {signature: $win_signature, url: $win_url}}}' \
            > "release-assets/${MANIFEST}"
          cat "release-assets/${MANIFEST}"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # A beta is a GitHub pre-release: it is never "latest", so the stable download URL ignores it.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Only a draft may be refreshed: a published release is what installed apps download.
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "release ${GITHUB_REF_NAME} is already published; not overwriting its assets" >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --title "OpenVids ${version}" \
              --notes-file "${RUNNER_TEMP}/release-notes.txt" \
              --prerelease="$PRERELEASE"
            gh release upload "$GITHUB_REF_NAME" --clobber release-assets/*
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "OpenVids ${version}" \
              --notes-file "${RUNNER_TEMP}/release-notes.txt" \
              --prerelease="$PRERELEASE" \
              release-assets/*
          fi
          ls -l release-assets
