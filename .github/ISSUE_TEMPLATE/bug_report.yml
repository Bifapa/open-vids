name: Bug report
description: Something in OpenVids does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Projects home / app shell
        - Editor (timeline, preview, inspector)
        - Agent chat
        - Story
        - Research and sources
        - Render and render QA
        - Build from source
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenVids version or commit
      placeholder: 0.1.0, or a commit hash
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.5, MacBook Pro M3
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, tokens and private file paths before pasting.
      render: text
